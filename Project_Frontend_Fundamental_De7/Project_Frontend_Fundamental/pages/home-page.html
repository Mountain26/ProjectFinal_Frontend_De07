<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/home-page.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>QuizzForge</h1>
            <input type="text" placeholder="Tìm kiếm bài test">
            <nav>
                <a href="../pages/home-page.html">Trang chủ</a>
                <a href="../pages/login.html">Đăng xuất</a>
            </nav>
        </header>
        <main>
            <section class="random-question">
                <h2>Hãy thử 1 câu đố ngẫu nhiên 🎲</h2>
                <button>Play</button>
            </section>
            <section class="highlighted-quizzes">
                <h2>🌟 Các câu đố nổi bật</h2>
                <div class="sort-buttons">
                    <label>Sắp xếp theo:</label>
                    <button class="sort-btn" data-sort="asc">Lượt chơi tăng dần</button>
                    <button class="sort-btn" data-sort="desc">Lượt chơi giảm dần</button>
                </div>
                <div id="quiz-container"></div>
                <div class="pagination">
                    <a href="#" class="page-prev">&lt;</a>
                    <div class="page-numbers"></div>
                    <a href="#" class="page-next">&gt;</a>
                </div>
            </section>
        </main>
        <footer>
            <p>© 2025 QuizzForge. All rights reserved.</p>
        </footer>
    </div>
    <script src="../js/home-page.js"></script>
</body>
</html>
