<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa bài test</title>
    <link rel="stylesheet" href="../css/change-test.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container-custom">
        <nav class="navbar-custom">
            <h1>QuizzForge</h1>
            <ul class="nav-links-custom">
                <li><a href="../pages/category-manager.html">Danh mục</a></li>
                <li class="disabled-li"><a href="../pages/test-manager.html">Bài test</a></li>
                <li><a href="../pages/login.html" class="logout">Đăng xuất</a></li>
            </ul>
        </nav>
    <div class="container">
        <div class="section">
            <h2>Sửa bài test</h2>
            <div class="form-group">
                <label for="test-name">Tên bài test</label>
                <input class="test-name" type="text" id="test-name" placeholder="Điền tên bài test">
            </div>
            <div class="frame">
                <div class="form-group">
                    <label for="category">Danh mục</label>
                    <select id="category">
                        <option value="">📚 Lịch sử</option>
                        <option value="">🧠 Khoa học</option>
                        <option value="">🏠 Đời sống</option>
                        <option value="">🍾 Poker</option>
                        <option value="">✍️ Ngữ văn</option>
                        <option value="">🚴 Đua xe</option>
                        <option value="">📱 Vật lí</option>
                        <option value="">🧠 Sinh học</option>
                        <option value="">📚 Toán học</option>
                        <option value="">👻 Hóa học</option>
                        <option value="">🇻🇳 Địa lí</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="duration">Thời gian (phút)</label>
                    <input type="number" id="duration" value="15">
                </div>
            </div>
        </div>
        <div class="section">
            <h2>Quản lý câu hỏi</h2>
            <div class="section2">
                <button class="btn" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#questionModal">Thêm câu hỏi</button>
                <button class="btn">Lưu</button>
            </div>
            <div class="content">
                <div class="frame-table">
                    <table class="category-table table">
                        <thead>
                            <tr>
                                <th class="text-center">ID</th>
                                <th>Tên danh mục</th>
                                <th class="text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>      
            </div>
        </div>
        <div class="modal fade" id="questionModal" tabindex="-1" aria-labelledby="questionModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="questionModalLabel">Sửa Câu Hỏi</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="questionContent" class="form-label">Câu hỏi</label>
                            <input type="text" id="questionContent" class="form-control" placeholder="Nhập câu hỏi">
                        </div>
                        <div id="answersContainer">
                            <div class="mb-3 answer-item">
                                <label for="questionContent" class="form-label">Câu trả lời</label>
                                <div class="input-group">
                                    <div class="input-group-text">
                                        <input type="radio" name="correctAnswer" value="0">
                                    </div>
                                    <input type="text" class="form-control" placeholder="Nhập câu trả lời">
                                    <button class="btn btn-danger delete-answer" type="button">
                                        <i class="bi bi-trash"></i>
                                </div>
                            </div>
                            <div class="mb-3 answer-item">
                                <div class="input-group">
                                    <div class="input-group-text">
                                        <input type="radio" name="correctAnswer" value="1">
                                    </div>
                                    <input type="text" class="form-control" placeholder="Nhập câu trả lời">
                                    <button class="btn btn-danger delete-answer" type="button">
                                        <i class="bi bi-trash"></i>
                                </div>
                            </div>
                            <div class="mb-3 answer-item">
                                <div class="input-group">
                                    <div class="input-group-text">
                                        <input type="radio" name="correctAnswer" value="2">
                                    </div>
                                    <input type="text" class="form-control" placeholder="Nhập câu trả lời">
                                    <button class="btn btn-danger delete-answer" type="button">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="mb-3 answer-item">
                                <div class="input-group">
                                    <div class="input-group-text">
                                        <input type="radio" name="correctAnswer" value="3">
                                    </div>
                                    <input type="text" class="form-control" placeholder="Nhập câu trả lời">
                                    <button class="btn btn-danger delete-answer" type="button">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <button id="addAnswerButton" class="btn btn-secondary mb-3">Thêm câu trả lời</button>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" id="saveQuestionButton">Lưu</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="editQuestionModal" tabindex="-1" aria-labelledby="questionModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="questionModalLabel">Sửa Câu Hỏi</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="questionContent" class="form-label">Câu hỏi</label>
                            <input type="text" id="questionContent" class="form-control" placeholder="Nhập câu hỏi">
                        </div>
                        <div id="answersContainer">
                            <div class="mb-3 answer-item">
                                <label for="questionContent" class="form-label">Câu trả lời</label>
                                <div class="input-group">
                                    <div class="input-group-text">
                                        <input type="radio" name="correctAnswer" value="0">
                                    </div>
                                    <input type="text" class="form-control" placeholder="Nhập câu trả lời">
                                    <button class="btn btn-danger delete-answer" type="button">
                                        <i class="bi bi-trash"></i>
                                </div>
                            </div>
                            <div class="mb-3 answer-item">
                                <div class="input-group">
                                    <div class="input-group-text">
                                        <input type="radio" name="correctAnswer" value="1">
                                    </div>
                                    <input type="text" class="form-control" placeholder="Nhập câu trả lời">
                                    <button class="btn btn-danger delete-answer" type="button">
                                        <i class="bi bi-trash"></i>
                                </div>
                            </div>
                            <div class="mb-3 answer-item">
                                <div class="input-group">
                                    <div class="input-group-text">
                                        <input type="radio" name="correctAnswer" value="2">
                                    </div>
                                    <input type="text" class="form-control" placeholder="Nhập câu trả lời">
                                    <button class="btn btn-danger delete-answer" type="button">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="mb-3 answer-item">
                                <div class="input-group">
                                    <div class="input-group-text">
                                        <input type="radio" name="correctAnswer" value="3">
                                    </div>
                                    <input type="text" class="form-control" placeholder="Nhập câu trả lời">
                                    <button class="btn btn-danger delete-answer" type="button">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <button id="addAnswerButton" class="btn btn-secondary mb-3">Sửa câu trả lời</button>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" id="saveQuestionButton">Lưu</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="deleteModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Xác nhận xóa</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p>Bạn chắc chắn muốn xóa danh mục này?</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                        <button type="button" class="btn btn-danger confirm-delete">Xóa</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>© 2025 QuizzForge. All rights reserved.</footer>
</div>
</body>
    <script src="../js/change-test.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
