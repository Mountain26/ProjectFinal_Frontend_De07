<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký</title>
  <link rel="stylesheet" href="../css/register.css">
  <link rel="stylesheet" href="../css/reset.css">
</head>
<body>
    <div class="outside-content">
      <h1>Đăng ký</h1>
      <p>QuizForge – Nền tảng sáng tạo bài kiểm tra trực tuyến, <br> giúp bạn dễ dàng thiết kế, chia sẻ và thực hiện các bài <br> kiểm tra một cách nhanh chóng và hiệu quả!</p>
    </div>
    <div class="container">
        <form id="registration-form">
            <input id="fullName" type="text" placeholder="Họ và tên">
            <div id="nameError" class="error-message"></div>
            <input id="email" type="text" placeholder="Email">
            <div id="emailError" class="error-message"></div>
            <input id="password" type="password" placeholder="Mật khẩu">
            <div id="passwordError" class="error-message"></div>
            <input id="confirmPassword" type="password" placeholder="Xác nhận mật khẩu">
            <div id="confirmPasswordError" class="error-message"></div>
            <button type="submit">Đăng ký</button>
        </form>
      <div class="login-link">  
        <p>Đã có tài khoản? <a href="../pages/login.html">Đăng nhập</a></p>
      </div>
    </div>
    <script src="../js/register.js"></script>
  </body>
  </html>
