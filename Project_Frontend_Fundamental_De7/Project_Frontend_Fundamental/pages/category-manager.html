<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/category-manager.css">
</head>
<body>
    <div class="container-custom">
        <nav class="navbar-custom">
            <h1>QuizzForge</h1>
            <ul class="nav-links-custom">
                <li class="disabled-li"><a href="../pages/category-manager.html">Danh mục</a></li>
                <li><a href="../pages/test-manager.html">Bài test</a></li>
                <li><a href="../pages/login.html" class="logout">Đăng xuất</a></li>
            </ul>
        </nav>
        <div class="content">
            <div class="frame-table">
                <h2>Quản lý danh mục</h2>
                <button class="btn btn-primary btn-add" data-bs-toggle="modal" data-bs-target="#addCategoryModal">Thêm danh mục</button>
                <table class="category-table table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên danh mục</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
            <div class="pagination">
                <a href="#" class="page-prev">&lt;</a>
                <div class="page-numbers"></div>
                <a href="#" class="page-next">&gt;</a>
            </div>
        </div>
        <footer>© 2025 QuizzForge. All rights reserved.</footer>
    </div>
    <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-labelledby="addCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addCategoryModalLabel">Thêm danh mục</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addCategoryForm">
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">Tên danh mục</label>
                            <input type="text" class="form-control" id="categoryName">
                            <div class="invalid-feedback" id="categoryNameError"></div>
                        </div>
                        <div class="mb-3">
                            <label for="categoryEmoji" class="form-label">Emoji</label>
                            <input type="text" class="form-control" id="categoryEmoji">
                            <div class="invalid-feedback" id="categoryEmojiError"></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" form="addCategoryForm" class="btn btn-primary">Lưu</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="editCategoryModal" tabindex="-1" aria-labelledby="editCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editCategoryModalLabel">Sửa danh mục</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editCategoryForm">
                        <div class="mb-3">
                            <label for="editCategoryName" class="form-label">Tên danh mục</label>
                            <input type="text" class="form-control" id="editCategoryName">
                            <div class="invalid-feedback" id="editCategoryNameError"></div>
                        </div>
                        <div class="mb-3">
                            <label for="editCategoryEmoji" class="form-label">Emoji</label>
                            <input type="text" class="form-control" id="editCategoryEmoji">
                            <div class="invalid-feedback" id="editCategoryEmojiError"></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" form="editCategoryForm" class="btn btn-primary">Lưu</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Xác nhận xóa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Bạn chắc chắn muốn xóa danh mục này?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                    <button type="button" class="btn btn-danger confirm-delete">Xóa</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/category-manager.js"></script>
</body>
</html>
